schemaVersion: 1
id: review
version: 2.1.0
description: List captures at one status, quarantined by default, and accept, edit, or reject one; reject also withdraws an accepted capture. Never deletes a source.
triggers:
  - manual
inputs:
  status:
    type: string
    required: false
    description: Which status to list - quarantined (default), accepted, rejected, staging, ingested, or failed. Lists only; never combined with a decision.
  decision:
    type: string
    required: false
    description: accept, edit, or reject. Absent means list.
output:
  reviewed:
    type: integer
    required: true
    description: How many captures changed status.
capabilities: []
scopes:
  read:
    - content/_raw/quarantine/**
  write:
    - content/_raw/quarantine/**
refusals:
  - when: vault-missing
    exit: 1
    message: No vault was found. Run developer-os init first.
  - when: input-invalid
    exit: 2
    message: A decision must be accept, edit, or reject, and a status must be quarantined, accepted, rejected, staging, ingested, or failed. A status is never combined with a decision.
  - when: scope-violation
    exit: 5
    message: Review changes a capture's status and never deletes its source.
steps:
  - id: list
    do: capture.list
    with:
      status: $input.status
  - id: decide
    do: capture.setStatus
    with:
      decision: $input.decision
  - id: edit
    do: capture.edit
validators:
  - no source file is removed by any decision
recovery:
  leaves: every capture at its previous status
  resume: developer-os review
