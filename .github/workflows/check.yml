name: check

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

# A new push cancels the older run of the same ref; tests/check.test.sh makes a run long.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # tests/skill-usage.test.sh needs ripgrep and fails without it in CI.
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ripgrep
      # Static lint of skills, hooks and plugin manifests, run by scripts/check.sh; settings and suppressions in .agnix.toml.
      # The binary is pinned by its own hash, not by a checksum file from the same release.
      - name: Set up agnix
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o agnix.tar.gz https://github.com/agent-sh/agnix/releases/download/v0.57.0/agnix-x86_64-unknown-linux-gnu.tar.gz
          echo "c72bf5ff1f45900055c353cc1bd6bbea6389506a3ba3197db000340066c78098  agnix.tar.gz" | sha256sum -c -
          tar -xzf agnix.tar.gz agnix
          sudo mv agnix /usr/local/bin/
          rm agnix.tar.gz
      # --ignore-scripts skips every dependency's lifecycle script; only Claude Code's own postinstall,
      # which links its native binary, runs, by name.
      - run: |
          npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.300
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
      - name: gitleaks over the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request must not loosen its own scan. BASE...HEAD diffs from the merge base: only the PR's own changes.
          if git diff --name-only "$BASE...$HEAD" | grep -E '(^|/)\.gitleaks(\.toml|ignore)$'; then
            echo "gitleaks configuration changed in this pull request; a maintainer reviews it by hand" >&2; exit 1
          fi
          # The bracket keeps this line from matching itself, so this file stays scanned.
          if git diff "$BASE...$HEAD" | grep -E '^\+.*gitleaks:[a]llow'; then
            echo "this pull request adds a gitleaks:allow marker; a maintainer reviews it by hand" >&2; exit 1
          fi
          gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
      - run: scripts/check.sh
