name: check

# Pull requests, and pushes to the default branch. Not a schedule and not a
# manual trigger: the point is that nothing lands without something other than
# the author's laptop having run the gates. DOS-P2 shipped three defects that a
# green local gate did not see.
#
# `push:` is scoped rather than bare. Unscoped, a branch with an open pull
# request runs the whole suite twice for every commit — once for the push and
# once for the pull request — which was measured on this workflow's own first
# run.
#
# **This comment used to claim a repository rule required a pull request to
# reach the default branch, and that was checked and found false on
# 2026-09-03.** The `baseline` ruleset on `development` carries only `deletion`
# and `non_fast_forward`; nothing requires a pull request and nothing requires a
# status check. So the `push:` trigger below is not a second net behind a rule —
# for a direct push it is the only net there is. Scoping it to `development`
# keeps that net in place while leaving topic branches with no open pull request
# unchecked, which is the intended trade and not an oversight.
#
# **The scoped branch was `feat/foundation` until 2026-08-21, and by then it did
# not exist on the remote.** It had been the default branch when this file was
# written; the default moved to `development` and this trigger did not follow.
# It now names the branch that is actually the default.
on:
  push:
    branches:
      - development
  pull_request:

# Least privilege. This workflow reads the repository and writes nothing —
# no packages, no releases, no comments, no commits.
permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# **Sharded on 2026-09-04, because the suite stopped fitting one job.** A whole
# `npm run check` was measured still inside its bootstrap-executor phase when it
# was killed at 29 minutes, against a `timeout-minutes: 30` — so the gate was
# not reporting a failure, it was reporting nothing at all. NEW-52 owns making
# the suite smaller; this makes the bound meaningful in the meantime.
#
# The split is the one `npm test` already used internally, now named in
# `package.json` so each job runs a script a developer can run verbatim. That
# preserves what the single `npm run check` step was protecting: CI cannot drift
# from local, because neither side spells the vitest invocations itself.
#
# Both paths cover the same files, by different routes. Here: five parallel
# jobs — `lint` (`npm run lint`, the build, `git diff --check`),
# `bootstrap-executor` (`npm run test:bootstrap`), `suite`
# (`npm run test:suite`, which excludes the executor file, `e2e/**` and
# `integration/ingest/no-user-hooks.test.ts`), `e2e` (`npm run test:e2e`), and
# `vendor-ingest` (`npm run test:vendor-ingest`). Locally: `npm run check` runs
# `npm run lint`, then `npm test` (`test:bootstrap` and `test:suite`), then
# `npm run test:e2e`, then `npm run test:vendor-ingest`, then the build, then
# `git diff --check`. `test:e2e` and `test:vendor-ingest` are spelled out in
# `check` because `test:suite` excludes `e2e/**` and
# `integration/ingest/no-user-hooks.test.ts` for the sharding above, so
# `npm test` alone no longer reaches either.
jobs:
  # macOS on every job, and not a preference. `packages/platform-macos` shells
  # out to `/usr/bin/lockf` for advisory locking, and the e2e suite drives the
  # real provider rather than a double. On Linux the transaction lock has no
  # implementation, so a green Linux run would be measuring a different product.
  lint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff --check` needs a real working tree. It does not need
          # history, so the default shallow fetch is right — but
          # `tests/repository/` enumerates files through `git ls-files`, so the
          # repository must be a checkout and not an export.
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          # The range `package.json` declares, so CI tests what the product
          # claims to support rather than one pinned patch. If a later 24.x
          # breaks a gate, that is a fact worth learning here and not from a
          # user — `Intl.Segmenter` in particular carries an ICU version, and
          # `packages/brain` pins its locale for exactly that reason.
          node-version: '24'
      - name: Enable pnpm through corepack
        # `packageManager` in `package.json` names the exact version, so this
        # cannot drift from what the lockfile was written by.
        run: corepack enable
      - name: Install
        # Frozen: a lockfile the install is allowed to rewrite is not a lockfile.
        run: pnpm install --frozen-lockfile
      # **Temporary diagnostic, added 2026-09-07. Delete it once NEW-77 is
      # closed.** Run 34133320221 failed the four `SpawnRenameAtxRunner real
      # kernel boundary` cases with `MacOsRetainedRenameRefusalError`, and the
      # stack pinned `retained-rename.ts:392` — the `result.exitCode !== 0` arm,
      # so `osascript` ran and exited non-zero. It is not the trust check: both
      # `refuses an untrusted osascript` and `requires the fixed osascript
      # capability on a supported macOS host` passed on that same runner.
      #
      # The product reads only the exit code and discards stderr, by design, so
      # a refusal cannot say which half failed: the JXA ObjC bridge being
      # unavailable in a headless session, or `renameatx_np` itself refusing on
      # the runner's filesystem. This step prints what the product cannot. It
      # never fails the job — a diagnostic that can red a gate is a second
      # source of false failures, which is the thing being diagnosed.
      # **Temporary diagnostic, added 2026-09-07. Delete it with NEW-77.**
      # The first pass of this step already ruled out the obvious causes on the
      # runner: /usr/bin/osascript is root-owned and not group-writable, the JXA
      # ObjC bridge loads, `renameatx_np` binds, and the work directory is APFS.
      # So the failure is the call itself.
      #
      # The remaining suspect is the flag word. `RENAME_FLAGS` is the bare
      # literal 0x34 with no comment anywhere in the repository, and it
      # decomposes to RENAME_EXCL (0x04) | RENAME_NOFOLLOW_ANY (0x10) | 0x20 —
      # where 0x20 is *not defined* in the macOS SDK headers, which stop at
      # 0x10. All three of 0x34, 0x14 and 0x04 succeed on Darwin 25.6.0, so that
      # kernel tolerates the undefined bit. This runner is Darwin 24. If 0x34
      # fails here and 0x14 succeeds, the undefined bit is the whole bug and the
      # product has been relying on one kernel's tolerance.
      - name: Diagnose renameatx_np flag acceptance (temporary, NEW-77)
        continue-on-error: true
        run: |
          cat > /tmp/renameflags.mjs <<'DIAG'
          import { spawn } from "node:child_process";
          import { mkdtempSync, mkdirSync, writeFileSync, openSync, closeSync, rmSync } from "node:fs";
          import { tmpdir, release } from "node:os";
          import { join } from "node:path";
          const PROGRAM = (flags) => `
          ObjC.bindFunction("renameatx_np", ["int", ["int", "char*", "int", "char*", "unsigned int"]]);
          const argv = $.NSProcessInfo.processInfo.arguments;
          const source = argv.objectAtIndex(5).UTF8String;
          const destination = argv.objectAtIndex(6).UTF8String;
          const result = $.renameatx_np(3, source, 4, destination, ${flags});
          if (result !== 0) throw new Error("renameatx_np refused rc=" + result);
          `;
          async function attempt(flags, label) {
            const root = mkdtempSync(join(tmpdir(), "renameflags-"));
            const a = join(root, "a"), b = join(root, "b");
            mkdirSync(a, { mode: 0o700 }); mkdirSync(b, { mode: 0o700 });
            writeFileSync(join(a, "src.txt"), "x");
            const fdA = openSync(a, "r"), fdB = openSync(b, "r");
            const child = spawn("/usr/bin/osascript",
              ["-l", "JavaScript", "-e", PROGRAM(flags), "src.txt", "dst.txt"],
              { shell: false, env: {}, stdio: ["ignore", "ignore", "pipe", fdA, fdB] });
            let err = "";
            child.stderr.on("data", (d) => { err += d.toString(); });
            const code = await new Promise((res) => child.on("close", res));
            closeSync(fdA); closeSync(fdB); rmSync(root, { recursive: true, force: true });
            console.log(`${label} flags=0x${flags.toString(16)} exit=${code} stderr=${err.trim().slice(0,200) || "(none)"}`);
          }
          console.log("Darwin " + release());
          await attempt(0x34, "product value  ");
          await attempt(0x14, "without 0x20   ");
          await attempt(0x04, "EXCL only      ");
          DIAG
          node /tmp/renameflags.mjs || true
      - name: Lint
        # Includes the self-containment enumerator and the control-byte scan.
        run: npm run lint
      - name: Build
        run: pnpm --pm-on-fail=ignore build
      - name: Working tree
        run: git diff --check

  bootstrap-executor:
    # `apps/cli/src/bootstrap/executor.test.ts` alone, in the two invocations
    # `npm run test:bootstrap` performs. It is split from the rest because one
    # of its 69 cases is not isolation-safe as the first row of the file, and
    # because it dominates the suite's wall clock — a fresh V2 `init` is roughly
    # 101s and this file runs many.
    #
    # **Measured 2026-09-04 on the development laptop:** the first invocation is
    # 96s and the second is 6963s, so `test:bootstrap` is close to two hours.
    # Read that as a lower bound rather than a target — that run ended red, and a
    # green run has to carry every case to completion — and a macOS hosted runner
    # is generally slower than the machine it was measured on. Hence three hours.
    #
    # A three-hour CI job is not acceptable as a resting state; it is what makes
    # the gate report something instead of being killed mid-phase. NEW-52 and
    # NEW-53's remainder own bringing it down, and this bound should be lowered
    # from the first green run's real figure.
    #
    # **Raised 180 -> 330 on 2026-09-07, before it was ever observed failing.**
    # The 180 was derived from a local measurement and the note above already
    # warned a hosted runner is slower; run 34125923469 measured how much
    # slower — ~1.9-2x, from retained-evidence cases taking 237,571 ms against
    # 112-120 s locally. `npm run test:bootstrap` measured 124.5 min locally on
    # 2026-09-07, which projects to ~236 min here, over the old bound. Raising
    # it after watching two other jobs die on the clock rather than paying a
    # third cycle to confirm the arithmetic.
    #
    # A 5.5-hour bound is indefensible as a steady state and is not defended:
    # it is the measurement bound, and NEW-53's residual is the reason it is
    # needed. About 99% of an `init` is canonical-JSON encoding, not the 0.8 s
    # of disk its 73 files cost, and the named call sites are in that row.
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # Belt and braces with the `apps/cli` vitest aliases, which are what
      # actually make this job independent of `dist`. Run 34119837698 failed
      # here in 718ms because one workspace package was missing from that alias
      # list and resolved to a `dist` no step had built. The alias is restored,
      # but the list is something a person has to keep complete and a sixth
      # package would break this again, on CI only. A one-minute build on a
      # job budgeted for three hours removes that whole class of failure.
      - name: Build
        run: pnpm --pm-on-fail=ignore build
      - name: Bootstrap executor
        run: npm run test:bootstrap

  suite:
    # Every test file except the executor file and tests/e2e, which the jobs above and below own.
    #
    # **Raised from 40 to 75 on 2026-09-07, because 40 was never a measured
    # bound.** Run 34121831849 killed this job at 40.3 minutes with no test
    # having failed — every step through `Build` succeeded and `Suite` was cut
    # off mid-run, which reports nothing about the code. The three measurements
    # that exist: 35.4 min local on a quiet machine (2026-09-06), 46.3 min local
    # under load (2026-09-07, green, 4598 passed), and >40.3 min on a `macos-15`
    # hosted runner, which is generally slower than either. A 40-minute bound
    # left 4.6 minutes of headroom over the most favourable of those and none at
    # all over the others.
    #
    # **75 was also wrong, and run 34125923469 killed this job again at 75.4
    # min.** Both guesses assumed a hosted runner is ~1.5x this laptop. The
    # measurement says ~1.9-2x: the same retained-evidence cases that take
    # 112-120 s locally took 237,571 ms and 208,545 ms there. So the suite needs
    # about 46.3 x 1.9 = 88 min, and neither 40 nor 75 was ever reachable.
    #
    # 150 is deliberately oversized. Its purpose is to obtain the number, since
    # a job killed mid-run reports nothing and two budgets have now been guessed
    # in a row. Lower it to the first green run's real figure plus margin, and
    # cite that run. An unused budget minute is not billed; a killed job costs a
    # whole cycle.
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # tests/security and tests/repository import the compiled CLI from dist.
        run: pnpm --pm-on-fail=ignore build
      - name: Suite
        run: npm run test:suite

  e2e:
    # Separate here as it is locally: these spawn the compiled binary under a
    # temporary HOME and are the only tests that exercise the real transaction,
    # the real lock, and the real filesystem.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # `tests/e2e` imports from `dist`, which the `lint` job builds in its own
        # runner and this one does not inherit.
        run: pnpm --pm-on-fail=ignore build
      - name: End to end
        run: pnpm test:e2e

  vendor-ingest:
    # `tests/integration/ingest/no-user-hooks.test.ts` alone, excluded from
    # `suite` on 2026-09-05: it spawns the real `claude` binary twice and
    # holds each process ~15s because the vendor never exits on its own.
    # Measured that day, leaving it inside the parallel suite pushed eight
    # already-slow retained-evidence tests past their 300s timeout; excluding
    # it took the suite from ten failures to two. Same treatment `e2e/**`
    # already gets, per founder decision D10.
    #
    # This job proves the isolation property only on a runner that has
    # `claude` installed. The test's own `it.skipIf` makes the job pass
    # without running a single case when the binary is absent, and hosted
    # `macos-15` runners do not ship it — so a green run here is not evidence
    # that no user hook loaded. The actual guarantee comes from `npm run
    # check` on a developer machine that has the vendor installed; this job
    # exists so a machine that *does* have it is still covered by CI, not to
    # replace that local gate.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # The test imports `@developer-os/adapter-claude` and
        # `@developer-os/security`, both of which resolve through `exports`
        # to `dist/index.js` rather than source.
        run: pnpm --pm-on-fail=ignore build
      - name: Vendor ingest isolation
        run: npm run test:vendor-ingest
