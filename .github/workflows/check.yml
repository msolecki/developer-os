name: check

# Pull requests, and pushes to the default branch. Not a schedule and not a
# manual trigger: the point is that nothing lands without something other than
# the author's laptop having run the gates. DOS-P2 shipped three defects that a
# green local gate did not see.
#
# `push:` is scoped rather than bare. Unscoped, a branch with an open pull
# request runs the whole suite twice for every commit — once for the push and
# once for the pull request — which was measured on this workflow's own first
# run. Scoping it to the default branch loses nothing: a commit that lands is
# checked either way, and a topic branch with no pull request open is not yet
# asking to land.
#
# **The scoped branch was `feat/foundation` until 2026-08-21, and by then it did
# not exist.** It had been the default branch when this file was written; the
# default moved to `development` and this trigger did not follow, so pushes ran
# no workflow at all. The paragraph above also claimed "a repository rule
# requires a pull request to reach the default branch" — `development` carries
# no branch protection, so a direct push lands without a pull request and, with
# a dead branch named here, without a check. **Both halves of the guarantee this
# comment describes were false**, which is the failure mode `BACKLOG.md` §7
# calls a gate that can pass by scanning nothing, one level up: a gate that runs
# on nothing at all.
on:
  push:
    branches:
      - development
  pull_request:

# Least privilege. This workflow reads the repository and writes nothing —
# no packages, no releases, no comments, no commits.
permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, and not a preference. `packages/platform-macos` shells out to
    # `/usr/bin/lockf` for advisory locking, and the e2e suite drives the real
    # provider rather than a double. On Linux the transaction lock has no
    # implementation, so a green Linux run would be measuring a different
    # product.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run check` ends in `git diff --check`, which needs a real
          # working tree. It does not need history, so the default shallow
          # fetch is right — but `tests/repository/` enumerates files through
          # `git ls-files`, so the repository must be a checkout and not an
          # export.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # The range `package.json` declares, so CI tests what the product
          # claims to support rather than one pinned patch. If a later 24.x
          # breaks a gate, that is a fact worth learning here and not from a
          # user — `Intl.Segmenter` in particular carries an ICU version, and
          # `packages/brain` pins its locale for exactly that reason.
          node-version: '24'

      - name: Enable pnpm through corepack
        # `packageManager` in `package.json` names the exact version, so this
        # cannot drift from what the lockfile was written by.
        run: corepack enable

      - name: Install
        # Frozen: a lockfile the install is allowed to rewrite is not a lockfile.
        run: pnpm install --frozen-lockfile

      - name: Gates
        # `npm run check` is `lint && test && build && git diff --check`, and
        # `lint` includes the self-containment enumerator and the control-byte
        # scan. One command, so CI cannot drift from what a developer runs.
        run: npm run check

      - name: End to end
        # Separate from `check` here as it is locally: these spawn the compiled
        # binary under a temporary HOME and are the only tests that exercise
        # the real transaction, the real lock, and the real filesystem.
        run: pnpm test:e2e
