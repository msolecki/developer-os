name: check

# Pull requests, and pushes to the default branch. Not a schedule and not a
# manual trigger: the point is that nothing lands without something other than
# the author's laptop having run the gates. DOS-P2 shipped three defects that a
# green local gate did not see.
#
# `push:` is scoped rather than bare. Unscoped, a branch with an open pull
# request runs the whole suite twice for every commit — once for the push and
# once for the pull request — which was measured on this workflow's own first
# run.
#
# **This comment used to claim a repository rule required a pull request to
# reach the default branch, and that was checked and found false on
# 2026-09-03.** The `baseline` ruleset on `development` carries only `deletion`
# and `non_fast_forward`; nothing requires a pull request and nothing requires a
# status check. So the `push:` trigger below is not a second net behind a rule —
# for a direct push it is the only net there is. Scoping it to `development`
# keeps that net in place while leaving topic branches with no open pull request
# unchecked, which is the intended trade and not an oversight.
#
# **The scoped branch was `feat/foundation` until 2026-08-21, and by then it did
# not exist on the remote.** It had been the default branch when this file was
# written; the default moved to `development` and this trigger did not follow.
# It now names the branch that is actually the default.
on:
  push:
    branches:
      - development
  pull_request:

# Least privilege. This workflow reads the repository and writes nothing —
# no packages, no releases, no comments, no commits.
permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# **Sharded on 2026-09-04, because the suite stopped fitting one job.** A whole
# `npm run check` was measured still inside its bootstrap-executor phase when it
# was killed at 29 minutes, against a `timeout-minutes: 30` — so the gate was
# not reporting a failure, it was reporting nothing at all. NEW-53 owns making
# the suite smaller; this makes the bound meaningful in the meantime.
#
# The split is the one `npm test` already used internally, now named in
# `package.json` so each job runs a script a developer can run verbatim. That
# preserves what the single `npm run check` step was protecting: CI cannot drift
# from local, because neither side spells the vitest invocations itself.
#
# Both paths cover the same files, by different routes. Here: six jobs, two
# of them matrices, all in parallel — `lint` (`npm run lint`, the build,
# `git diff --check`), `bootstrap-executor` (two shards,
# `npm run test:bootstrap:main` and `:fine-grained`, which together are
# `npm run test:bootstrap`), `suite` (`npm run test:suite`, which excludes the
# executor file, `e2e/**`, `integration/ingest/no-user-hooks.test.ts` and
# `**/*.v2.test.ts`), `lifecycle-v2` (three shards,
# `npm run test:lifecycle:uninstall`, `:core` and `:rest`, which together are
# `npm run test:lifecycle`), `e2e` (`npm run test:e2e`), and `vendor-ingest`
# (`npm run test:vendor-ingest`). Locally: `npm run check` runs
# `npm run lint`, then `npm test` (`test:bootstrap`, `test:suite` and
# `test:lifecycle`), then `npm run test:e2e`, then `npm run test:vendor-ingest`,
# then the build, then `git diff --check`. `test:e2e` and `test:vendor-ingest` are spelled out in
# `check` because `test:suite` excludes `e2e/**` and
# `integration/ingest/no-user-hooks.test.ts` for the sharding above, so
# `npm test` alone no longer reaches either.
#
# The shard scripts are the one place this drift guarantee is weaker: they
# restate `test:bootstrap`'s and `test:lifecycle`'s filters instead of being
# composed from them, so changing either side means changing the other and
# re-checking, with `vitest list` per filter, that the shards still partition
# the aggregate by test id.
jobs:
  # macOS on every job, and not a preference. `packages/platform-macos` shells
  # out to `/usr/bin/lockf` for advisory locking, and the e2e suite drives the
  # real provider rather than a double. On Linux the transaction lock has no
  # implementation, so a green Linux run would be measuring a different product.
  lint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff --check` needs a real working tree. It does not need
          # history, so the default shallow fetch is right — but
          # `tests/repository/` enumerates files through `git ls-files`, so the
          # repository must be a checkout and not an export.
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          # The range `package.json` declares, so CI tests what the product
          # claims to support rather than one pinned patch. If a later 24.x
          # breaks a gate, that is a fact worth learning here and not from a
          # user — `Intl.Segmenter` in particular carries an ICU version, and
          # `packages/brain` pins its locale for exactly that reason.
          node-version: '24'
      - name: Enable pnpm through corepack
        # `packageManager` in `package.json` names the exact version, so this
        # cannot drift from what the lockfile was written by.
        run: corepack enable
      - name: Install
        # Frozen: a lockfile the install is allowed to rewrite is not a lockfile.
        run: pnpm install --frozen-lockfile
      - name: Lint
        # Includes the self-containment enumerator and the control-byte scan.
        run: npm run lint
      - name: Build
        run: pnpm --pm-on-fail=ignore build
      - name: Working tree
        run: git diff --check

  bootstrap-executor:
    # `apps/cli/src/bootstrap/executor.test.ts` alone, split from the suite
    # because it dominates the wall clock — a fresh V2 `init` is roughly 101s
    # and this file runs many. `npm run test:bootstrap` runs it in two
    # invocations: the one case that is not isolation-safe (`publishes a
    # complete V2 handoff ...`) alone, then the other 93 of its 94 cases.
    #
    # **Sharded by `-t` group on 2026-09-26 (NEW-100).** On PR #15 the hosted
    # runner cancelled the unsharded job at its 330-minute bound against a
    # 122-minute local run on `bc17550` (97.4 s + 7265.4 s), so the hosted ratio
    # there was at least 2.7x — not the ~1.9-2x run 34125923469 measured. The
    # shards below partition `test:bootstrap`'s 94 cases exactly (checked with
    # `vitest list` per filter against the unsharded filters, by test id):
    #
    # - `main` (`npm run test:bootstrap:main`, 54 cases): the isolated case,
    #   then every case that is neither it nor `fine-grained death`. Local
    #   upper bound 4486.8 s = 97.4 s + (7265.4 s - 40 x 71.9 s), 71.9 s being
    #   the fastest fine-grained case ever observed locally.
    # - `fine-grained` (`npm run test:bootstrap:fine-grained`, 40 cases): the
    #   `fresh-process recovers exact terminal evidence at fine-grained death`
    #   matrix. Local upper bound 5600 s = 40 x 140 s, 140 s being the slowest
    #   ordinary local observation (71.9-139.6 s; two contended outliers at
    #   734.7 s and 946.8 s are excluded, and would already break the matrix's
    #   own 600 s per-test timeout on a hosted runner).
    #
    # No per-case timing of a green run exists; both bounds are derived from
    # partial observations and sum to 10086.8 s against the 7362.8 s measured
    # whole, so they overstate. Budget per shard, as for `lifecycle-v2`: local
    # bound x 2 for a hosted runner x 1.5 headroom, which covers a hosted ratio
    # up to 3.0x — little margin over PR #15's 2.7x. Replace both bounds with
    # the first green sharded run's real figures.
    #
    # About 99% of an `init` is canonical-JSON encoding, not the 0.8 s of disk
    # its 73 files cost; NEW-53's residual owns making this smaller.
    runs-on: macos-15
    strategy:
      # One red or killed shard must not cancel the other: a cancelled job
      # reports nothing.
      fail-fast: false
      matrix:
        include:
          - shard: main
            # ceil(4486.8 x 3 / 60)
            timeout: 225
          - shard: fine-grained
            # ceil(5600 x 3 / 60)
            timeout: 280
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # Belt and braces with the `apps/cli` vitest aliases, which are what
      # actually make this job independent of `dist`. Run 34119837698 failed
      # here in 718ms because one workspace package was missing from that alias
      # list and resolved to a `dist` no step had built. The alias is restored,
      # but the list is something a person has to keep complete and a sixth
      # package would break this again, on CI only. A one-minute build on a
      # job budgeted for hours removes that whole class of failure.
      - name: Build
        run: pnpm --pm-on-fail=ignore build
      - name: Bootstrap executor (${{ matrix.shard }})
        run: npm run test:bootstrap:${{ matrix.shard }}

  suite:
    # Every test file except the executor file, tests/e2e and the real-V2-home
    # `*.v2.test.ts` files, which the jobs above and below own.
    #
    # **Raised from 40 to 75 on 2026-09-07, because 40 was never a measured
    # bound.** Run 34121831849 killed this job at 40.3 minutes with no test
    # having failed — every step through `Build` succeeded and `Suite` was cut
    # off mid-run, which reports nothing about the code. The three measurements
    # that exist: 35.4 min local on a quiet machine (2026-09-06), 46.3 min local
    # under load (2026-09-07, green, 4598 passed), and >40.3 min on a `macos-15`
    # hosted runner, which is generally slower than either. A 40-minute bound
    # left 4.6 minutes of headroom over the most favourable of those and none at
    # all over the others.
    #
    # **75 was also wrong, and run 34125923469 killed this job again at 75.4
    # min.** Both guesses assumed a hosted runner is ~1.5x this laptop. The
    # measurement says ~1.9-2x: the same retained-evidence cases that take
    # 112-120 s locally took 237,571 ms and 208,545 ms there. So the suite needs
    # about 46.3 x 1.9 = 88 min, and neither 40 nor 75 was ever reachable.
    #
    # 150 is deliberately oversized. Its purpose is to obtain the number, since
    # a job killed mid-run reports nothing and two budgets have now been guessed
    # in a row. Lower it to the first green run's real figure plus margin, and
    # cite that run. An unused budget minute is not billed; a killed job costs a
    # whole cycle.
    #
    # **Sharded 6 ways on 2026-09-30 (first 3).** PR #19's run 36653103882 cancelled the
    # unsharded job at this 150-minute bound with no test failed: the D70 lane
    # added the NEW-110 update recovery sweeps (a full `init` per death point)
    # to `test:suite`. Vitest's `--shard` splits the files; each shard keeps the
    # 150-minute bound until a green run gives real per-shard figures. Three
    # shards were not enough: run 36685922570's shard 3/3 was cancelled at 150
    # minutes with no test failed (shard 1/3 took 93 min, 2/3 49 min).
    name: suite (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # tests/security and tests/repository import the compiled CLI from dist.
        run: pnpm --pm-on-fail=ignore build
      - name: Suite
        run: npm run test:suite -- --shard=${{ matrix.shard }}/6

  lifecycle-v2:
    # Owns the real-V2-home `*.v2.test.ts` files, which `test:suite` excludes.
    # `apps/cli` serializes its files (`fileParallelism: false`), so the
    # per-file times add up to the wall clock.
    #
    # **Sharded by file on 2026-09-26 (NEW-100).** On PR #15 the hosted runner
    # cancelled the unsharded job at its 185-minute bound; the same tree
    # (`bc17550`) ran `npm run test:lifecycle` green locally in 9207.6 s
    # (153 min, 21 files, 208 tests). The per-file figures this comment used to
    # carry covered nine files, several since grown (`uninstall.v2.test.ts`
    # from 13 to 36 cases), so they are replaced by the per-shard bounds below.
    #
    # No per-file timing of that green run exists. Each file's figure is the
    # most conservative available, by source: (r) the figure this job's
    # comment recorded on 2026-09-21; (f) a local run in which the file failed,
    # scaled by current / then case count where the count has grown; (g) a
    # guess rounded up from the file's case and real-`init` count (~125 s per
    # `init`), for a file with no usable observation. The 21 figures sum to 12594.4 s against the measured
    # 9207.6 s, so in aggregate they overstate by ~37%.
    #
    # - `uninstall` (`npm run test:lifecycle:uninstall`, 4 files, 51 tests):
    #   `uninstall` 1657.9 (f), `uninstall-recovery` 1147.2 (r),
    #   `uninstall-detach` 706.2 (f), `uninstall-launchd` 600 (g) = 4111.3 s.
    # - `core` (`npm run test:lifecycle:core`, 6 files, 68 tests):
    #   `absent-manifest-uninstall` 1864.8 (r, 621.6 s for 2 cases scaled to 6),
    #   `manifest-anchor` 1251.2 (f), `mutation-gate` 586.4 (f),
    #   `manifest-rewrite` 125 (g), `mutation-gate-update` 102.7 (f),
    #   `admission` 82.2 (r) = 4012.3 s.
    # - `rest` (`npm run test:lifecycle:rest`, 11 files, 89 tests): every
    #   `*.v2.test.ts` the two shards above do not name —
    #   `init-local-release` 832.8 (f), `runner` 690.5 (f),
    #   `init-instructions` 683.8 (f), `bookkeeping` 525.2 (f),
    #   `doctor-instructions` 400 (g), `instructions-user-data` 375 (g),
    #   `git` 300 (g), `automation` 250 (g), `evidence-identity` 230.6 (f),
    #   `fresh-layout` 124 (r), `config` 58.9 (r) = 4470.8 s.
    #   (`git` and `automation` failed every case in their only observations,
    #   so those figures are guesses rather than measurements.)
    #
    # The shards partition `test:lifecycle`'s 208 tests exactly, checked with
    # `vitest list` per filter against the unsharded filter, by test id. The
    # `rest` script excludes exactly the ten files the other two name, so a
    # new `*.v2.test.ts` lands in `rest` and cannot fall through — but its
    # budget then needs rechecking, and a file moved between shards must move
    # in both the include list and `rest`'s exclude list.
    #
    # The budget per shard is its local bound x 2 for a hosted runner x 1.5
    # headroom, floored at 20: ceil(bound x 3 / 60). It covers a hosted ratio
    # up to 3.0x; PR #15's `bootstrap-executor` implies at least 2.7x. Replace
    # the bounds with the first green sharded run's real per-file figures.
    #
    # `uninstall-recovery.v2.test.ts`'s single chained case (1080.9 s of a
    # 1139.3 s run on 2026-09-21) carries its own `CHAIN_TIMEOUT_MS`, because
    # at a hosted ~2x it is more than twice `REAL_FILESYSTEM_TIMEOUT_MS`'s
    # 900 s: the chain reuses one home through six kill points, and every
    # `init` and `uninstall` inspects every retained bootstrap envelope, so it
    # is quadratic in cycle count by construction.
    runs-on: macos-15
    strategy:
      # One red or killed shard must not cancel the others: a cancelled job
      # reports nothing.
      fail-fast: false
      matrix:
        include:
          - shard: uninstall
            # ceil(4111.3 x 3 / 60)
            timeout: 206
          - shard: core
            # ceil(4012.3 x 3 / 60)
            timeout: 201
          - shard: rest
            # ceil(4470.8 x 3 / 60)
            timeout: 224
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --pm-on-fail=ignore build
      - name: Lifecycle V2 (${{ matrix.shard }})
        run: npm run test:lifecycle:${{ matrix.shard }}

  e2e:
    # Separate here as it is locally: these spawn the compiled binary under a
    # temporary HOME and are the only tests that exercise the real transaction,
    # the real lock, and the real filesystem.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # `tests/e2e` imports from `dist`, which the `lint` job builds in its own
        # runner and this one does not inherit.
        run: pnpm --pm-on-fail=ignore build
      - name: End to end
        run: pnpm test:e2e

  vendor-ingest:
    # `tests/integration/ingest/no-user-hooks.test.ts` alone, excluded from
    # `suite` on 2026-09-05: it spawns the real `claude` binary twice and
    # holds each process ~15s because the vendor never exits on its own.
    # Measured that day, leaving it inside the parallel suite pushed eight
    # already-slow retained-evidence tests past their 300s timeout; excluding
    # it took the suite from ten failures to two. Same treatment `e2e/**`
    # already gets, per founder decision D10.
    #
    # This job proves the isolation property only on a runner that has
    # `claude` installed. The test's own `it.skipIf` makes the job pass
    # without running a single case when the binary is absent, and hosted
    # `macos-15` runners do not ship it — so a green run here is not evidence
    # that no user hook loaded. The actual guarantee comes from `npm run
    # check` on a developer machine that has the vendor installed; this job
    # exists so a machine that *does* have it is still covered by CI, not to
    # replace that local gate.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm through corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # The test imports `@developer-os/adapter-claude` and
        # `@developer-os/security`, both of which resolve through `exports`
        # to `dist/index.js` rather than source.
        run: pnpm --pm-on-fail=ignore build
      - name: Vendor ingest isolation
        run: npm run test:vendor-ingest
